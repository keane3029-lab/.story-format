<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#0b0b12" />
    </linearGradient>

    <!-- Branch Path Gradient -->
    <linearGradient id="path-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#f5c2e7" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Square Badge Base -->
  <rect width="512" height="512" rx="100" fill="url(#bg-glow)" stroke="#313244" stroke-width="4" />

  <!-- Branching Node Network Icon -->
  <g transform="translate(64, 64)" filter="url(#neon-glow)">
    <!-- Node Connection Lines -->
    <path d="M 100 192 L 200 192 C 240 192, 240 100, 280 100 L 290 100" 
          fill="none" stroke="url(#path-grad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 200 192 L 290 192" 
          fill="none" stroke="url(#path-grad)" stroke-width="16" stroke-linecap="round" />
    <path d="M 200 192 C 240 192, 240 284, 280 284 L 290 284" 
          fill="none" stroke="url(#path-grad)" stroke-width="16" stroke-linecap="round" />

    <!-- Root Node -->
    <circle cx="100" cy="192" r="28" fill="#89b4fa" />
    <circle cx="100" cy="192" r="14" fill="#181825" />

    <!-- Decision Branch Nodes -->
    <circle cx="290" cy="100" r="20" fill="#cba6f7" />
    <circle cx="290" cy="192" r="20" fill="#cba6f7" />
    <circle cx="290" cy="284" r="20" fill="#f5c2e7" />

    <!-- Extension Text Label -->
    <text x="192" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#cdd6f4" text-anchor="middle" letter-spacing="2">
      .STORY
    </text>
  </g>
</svg>
